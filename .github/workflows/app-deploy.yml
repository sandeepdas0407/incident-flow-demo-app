name: app-deploy

on:
  push:
    branches: [main]
    paths: ["apps/**", "deploy/**", ".github/workflows/app-deploy.yml"]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  # shared with terraform-apply: never deploy to a VM that Terraform is resizing/rebooting
  group: azure-vm
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Deploy to VM
        run: |
          az vm run-command invoke \
            --resource-group "${{ vars.APP_RESOURCE_GROUP }}" \
            --name "${{ vars.APP_VM_NAME }}" \
            --command-id RunShellScript \
            --scripts @deploy/deploy-app.sh \
            --query "value[0].message" -o tsv | tee deploy.log
          grep -q "^deployed " deploy.log
      - name: Smoke test (port 80; the script health-checks every app on the VM)
        run: |
          for i in $(seq 1 10); do
            if curl -fsS "http://${{ vars.APP_DNS_LABEL }}.${{ vars.AZURE_LOCATION || 'centralindia' }}.cloudapp.azure.com/health"; then exit 0; fi
            sleep 6
          done
          exit 1
