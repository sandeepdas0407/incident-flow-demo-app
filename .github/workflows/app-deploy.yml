name: app-deploy

on:
  push:
    branches: [main]
    paths: ["app/**"]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: app-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Deploy to VM
        run: |
          az vm run-command invoke \
            --resource-group "${{ vars.APP_RESOURCE_GROUP }}" \
            --name "${{ vars.APP_VM_NAME }}" \
            --command-id RunShellScript \
            --scripts "/usr/local/bin/deploy-app" \
            --query "value[0].message" -o tsv | tee deploy.log
          grep -q "deployed" deploy.log
      - name: Smoke test
        run: |
          for i in $(seq 1 10); do
            if curl -fsS "http://${{ vars.APP_DNS_LABEL }}.${{ vars.AZURE_LOCATION || 'eastus' }}.cloudapp.azure.com/health"; then exit 0; fi
            sleep 6
          done
          exit 1
