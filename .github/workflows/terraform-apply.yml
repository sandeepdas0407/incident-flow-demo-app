name: terraform-apply

on:
  push:
    branches: [main]
    paths: ["infra/**"]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  # shared with app-deploy: a resize reboots the VM
  group: azure-vm
  cancel-in-progress: false

env:
  ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
  ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
  ARM_USE_OIDC: "true"
  TF_VAR_admin_ssh_public_key: ${{ vars.VM_SSH_PUBLIC_KEY }}
  TF_VAR_dns_label: ${{ vars.APP_DNS_LABEL }}
  TF_VAR_location: ${{ vars.AZURE_LOCATION }}
  TF_VAR_app_repo_url: ${{ github.server_url }}/${{ github.repository }}.git

jobs:
  apply:
    runs-on: ubuntu-latest
    environment: production
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - name: Init
        run: >
          terraform init -input=false
          -backend-config="resource_group_name=${{ vars.TFSTATE_RG }}"
          -backend-config="storage_account_name=${{ vars.TFSTATE_ACCOUNT }}"
          -backend-config="container_name=tfstate"
          -backend-config="key=incidentflow.tfstate"
      - run: terraform apply -input=false -auto-approve
      - run: terraform output
