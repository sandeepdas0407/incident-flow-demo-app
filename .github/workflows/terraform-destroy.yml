name: terraform-destroy

# Tears down the demo VM and everything in incidentflow-rg. Manual only, with a typed confirmation, and it runs in
# the `production` environment so any required reviewers must approve it too. The state storage and the CI identity
# are NOT touched; those belong to the bootstrap (Incident-Flow/azure/bootstrap).

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "destroy" to delete all demo Azure resources'
        required: true

permissions:
  id-token: write
  contents: read

concurrency:
  group: azure-vm
  cancel-in-progress: false

env:
  ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
  ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
  ARM_USE_OIDC: "true"
  TF_VAR_admin_ssh_public_key: ${{ vars.VM_SSH_PUBLIC_KEY }}
  TF_VAR_dns_label: ${{ vars.APP_DNS_LABEL }}
  TF_VAR_location: ${{ vars.AZURE_LOCATION }}
  TF_VAR_app_repo_url: ${{ github.server_url }}/${{ github.repository }}.git

jobs:
  destroy:
    if: inputs.confirm == 'destroy'
    runs-on: ubuntu-latest
    environment: production
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false
      - name: Init
        run: >
          terraform init -input=false
          -backend-config="resource_group_name=${{ vars.TFSTATE_RG }}"
          -backend-config="storage_account_name=${{ vars.TFSTATE_ACCOUNT }}"
          -backend-config="container_name=tfstate"
          -backend-config="key=incidentflow.tfstate"
      - name: Plan destroy
        run: |
          terraform plan -destroy -input=false -no-color -out=destroy.tfplan | tee plan.txt
          { echo "### Destroy plan"; echo '```'; tail -n 80 plan.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - run: terraform apply -input=false destroy.tfplan

  refused:
    if: inputs.confirm != 'destroy'
    runs-on: ubuntu-latest
    steps:
      - env:
          CONFIRM: ${{ inputs.confirm }}
        run: |
          echo "::error::Confirmation was '$CONFIRM', expected 'destroy'. Nothing was deleted."
          exit 1
