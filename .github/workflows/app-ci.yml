name: app-ci

on:
  pull_request:
    branches: [main]
    paths: ["apps/**"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [orders, inventory, bookings]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r apps/${{ matrix.app }}/requirements.txt
      - run: pytest -q apps/${{ matrix.app }}/tests
