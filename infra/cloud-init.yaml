#cloud-config
package_update: true
packages:
  - nginx
  - git
  - curl
  - python3-venv

# First boot only. After that, app-deploy.yml runs deploy/deploy-app.sh on every merge.
runcmd:
  - git clone --depth 1 ${repo_url} /opt/app
  - python3 -m venv /opt/venv
  - bash /opt/app/deploy/deploy-app.sh
